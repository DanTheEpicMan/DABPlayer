name: DABPlayer
description: "Offline-first audiobook player with optional cloud sync."
publish_to: 'none'

version: 2.0.1+8

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # UI / Platform
  cupertino_icons: ^1.0.8
  wakelock_plus: ^1.2.0

  # Storage
  shared_preferences: ^2.3.0
  path_provider: ^2.1.5
  path: ^1.9.1
  drift: ^2.22.1
  drift_sqflite: ^2.0.1
  sqlite3_flutter_libs: ^0.5.28

  # Optional Cloud Sync
  supabase_flutter: ^2.8.4

  # File System / Permissions
  permission_handler: ^12.0.0
  device_info_plus: ^12.3.0

  # Audio
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  just_audio: ^0.10.4

  # Voice Notes / Speech
  speech_to_text: ^7.3.0
  record: ^6.2.0
  http: ^1.6.0
  whisper_ggml_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/models/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_version: 21
